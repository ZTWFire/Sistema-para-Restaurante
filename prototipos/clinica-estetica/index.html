<title>Retorna Clínica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra lateral fixa + área de trabalho; cartões só para objetos (atendimentos, pacientes, pacotes); dinheiro em dourado, ação em orquídea */
:root{
  --bg:#F7F3F5; --surface:#FFFFFF; --surface-2:#F2ECEF; --line:#EAE1E6; --line-2:#DDD1D8;
  --ink:#2A1F2D; --ink-2:#6B5E70; --ink-3:#9A8E9E;
  --accent:#7A3B69; --accent-hover:#672F58; --accent-soft:#F4E7F0; --accent-ink:#FFFFFF;
  --gold:#94661F; --gold-soft:#F7EEDF;
  --ok:#2D7A57; --ok-soft:#E3F2EA; --warn:#A3621A; --warn-soft:#FBEFDB; --bad:#B6402F; --bad-soft:#FAE7E3; --info:#3B6597; --info-soft:#E6EEF8;
  --c-hof:#F2E4EE; --c-hof-ink:#6E3460; --c-pele:#E3F1EA; --c-pele-ink:#2E6B53; --c-laser:#E5EDF8; --c-laser-ink:#34598A; --c-corpo:#F6EDDE; --c-corpo-ink:#82602B; --c-aval:#EFEBF1; --c-aval-ink:#5B5260;
  --wa-bg:#EFE7DE; --wa-bubble:#D9FDD3; --wa-ink:#111B21; --wa-meta:#667781;
  --scrim:rgba(42,31,45,.32); --frame:#2A1F2D;
  --shadow:0 1px 2px rgba(42,31,45,.04), 0 10px 28px -16px rgba(42,31,45,.18);
  --shadow-lg:0 28px 70px -24px rgba(42,31,45,.40);
  --f-display:'Gloock', Georgia, 'Times New Roman', serif;
  --f-body:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#151116; --surface:#1E1920; --surface-2:#272029; --line:#322A35; --line-2:#3E3542;
  --ink:#F3EDF2; --ink-2:#B9AEBC; --ink-3:#877C8B;
  --accent:#D8A0C8; --accent-hover:#E4B4D6; --accent-soft:#3A2436; --accent-ink:#1B1219;
  --gold:#DDB878; --gold-soft:#2F2719;
  --ok:#72C9A0; --ok-soft:#18291F; --warn:#E6B460; --warn-soft:#2E2514; --bad:#EF8F82; --bad-soft:#36201C; --info:#93B6E3; --info-soft:#1B2534;
  --c-hof:#3A2335; --c-hof-ink:#EBBADB; --c-pele:#1B2E26; --c-pele-ink:#9DD7BC; --c-laser:#1D2837; --c-laser-ink:#AAC6EC; --c-corpo:#30281B; --c-corpo-ink:#E4C590; --c-aval:#2A252D; --c-aval-ink:#CBC1CF;
  --wa-bg:#0B141A; --wa-bubble:#005C4B; --wa-ink:#E9EDEF; --wa-meta:#8696A0;
  --scrim:rgba(0,0,0,.55); --frame:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
  --shadow-lg:0 28px 70px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#151116; --surface:#1E1920; --surface-2:#272029; --line:#322A35; --line-2:#3E3542;
  --ink:#F3EDF2; --ink-2:#B9AEBC; --ink-3:#877C8B;
  --accent:#D8A0C8; --accent-hover:#E4B4D6; --accent-soft:#3A2436; --accent-ink:#1B1219;
  --gold:#DDB878; --gold-soft:#2F2719;
  --ok:#72C9A0; --ok-soft:#18291F; --warn:#E6B460; --warn-soft:#2E2514; --bad:#EF8F82; --bad-soft:#36201C; --info:#93B6E3; --info-soft:#1B2534;
  --c-hof:#3A2335; --c-hof-ink:#EBBADB; --c-pele:#1B2E26; --c-pele-ink:#9DD7BC; --c-laser:#1D2837; --c-laser-ink:#AAC6EC; --c-corpo:#30281B; --c-corpo-ink:#E4C590; --c-aval:#2A252D; --c-aval-ink:#CBC1CF;
  --wa-bg:#0B141A; --wa-bubble:#005C4B; --wa-ink:#E9EDEF; --wa-meta:#8696A0;
  --scrim:rgba(0,0,0,.55); --frame:#000000;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
  --shadow-lg:0 28px 70px -24px rgba(0,0,0,.8);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:8px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:none}

/* Shell */
.shell{display:grid; grid-template-columns:248px minmax(0,1fr); grid-template-rows:minmax(0,1fr); height:100%}
.side{display:flex; flex-direction:column; gap:24px; padding:22px 14px 18px; padding-left:max(14px, env(safe-area-inset-left,0px)); border-right:1px solid var(--line); background:var(--bg); overflow-y:auto}
.brand{display:flex; align-items:center; gap:10px; padding:0 8px}
.brand-mark{width:34px; height:34px; border-radius:11px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center}
.brand-mark svg{width:20px; height:20px}
.brand-name{font-family:var(--f-display); font-size:22px; letter-spacing:.01em; line-height:1}
.brand-sub{font-size:11px; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase; margin-top:3px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav-label{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); padding:0 10px 6px}
.nav button{display:flex; align-items:center; gap:11px; width:100%; border:0; background:transparent; padding:9px 10px; border-radius:10px; color:var(--ink-2); font-weight:500; text-align:left; transition:background .15s, color .15s}
.nav button:hover{background:var(--surface-2); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.nav .badge{margin-left:auto; font-size:11px; font-weight:700; background:var(--accent); color:var(--accent-ink); border-radius:999px; padding:1px 7px; min-width:22px; text-align:center}
.side-foot{margin-top:auto; display:flex; align-items:center; gap:10px; padding:12px 10px; border-top:1px solid var(--line)}
.side-foot .who{min-width:0}
.side-foot .who b{display:block; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.side-foot .who span{font-size:12px; color:var(--ink-3)}

.main{overflow-y:auto; min-width:0}
.wrap{max-width:1240px; margin:0 auto; padding-block:28px 64px; padding-left:max(28px, env(safe-area-inset-left,0px)); padding-right:max(28px, env(safe-area-inset-right,0px))}

/* Header */
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px}
.eyebrow{font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:600}
h1{font-family:var(--f-display); font-weight:400; font-size:34px; line-height:1.1; margin:6px 0 6px; letter-spacing:-.005em; text-wrap:balance}
h2{font-family:var(--f-display); font-weight:400; font-size:21px; line-height:1.2; margin:0; text-wrap:balance}
h3{font-size:14px; font-weight:700; margin:0}
.lede{color:var(--ink-2); margin:0; max-width:62ch}
.actions{display:flex; gap:8px; flex-wrap:wrap}

/* Buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 15px; border-radius:11px; border:1px solid var(--line-2); background:var(--surface); color:var(--ink); font-weight:600; font-size:13.5px; white-space:nowrap; transition:background .15s, border-color .15s, transform .08s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover); border-color:var(--accent-hover)}
.btn.soft{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
.btn.soft:hover{filter:brightness(.97)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{height:32px; padding:0 11px; font-size:12.5px; border-radius:9px}
.btn svg.i{width:16px; height:16px}
.icon-btn{width:36px; height:36px; display:grid; place-items:center; border-radius:10px; border:0; background:transparent; color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2); color:var(--ink)}

/* Cards & bits */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px 12px}
.card-body{padding:0 20px 20px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:12.5px}
.pill{display:inline-flex; align-items:center; gap:6px; height:24px; padding:0 10px; border-radius:999px; font-size:12px; font-weight:600; white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.9}
.pill.plain::before{display:none}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.warn{background:var(--warn-soft); color:var(--warn)}
.pill.bad{background:var(--bad-soft); color:var(--bad)}
.pill.info{background:var(--info-soft); color:var(--info)}
.pill.accent{background:var(--accent-soft); color:var(--accent)}
.pill.gold{background:var(--gold-soft); color:var(--gold)}
.pill.neutral{background:var(--surface-2); color:var(--ink-2)}
.tag{display:inline-flex; align-items:center; height:24px; padding:0 9px; border-radius:7px; font-size:12px; font-weight:600}
.cat-hof{background:var(--c-hof); color:var(--c-hof-ink)}
.cat-pele{background:var(--c-pele); color:var(--c-pele-ink)}
.cat-laser{background:var(--c-laser); color:var(--c-laser-ink)}
.cat-corpo{background:var(--c-corpo); color:var(--c-corpo-ink)}
.cat-aval{background:var(--c-aval); color:var(--c-aval-ink)}
.av{width:38px; height:38px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:13px; flex:none; letter-spacing:.02em}
.av.lg{width:64px; height:64px; font-size:20px}
.av.sm{width:30px; height:30px; font-size:11px}
.row-person{display:flex; align-items:center; gap:12px; min-width:0}
.row-person .t{min-width:0}
.row-person .t b{display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.row-person .t span{display:block; font-size:12.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.divider{height:1px; background:var(--line); border:0; margin:0}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px; margin-bottom:22px}
.kpi{padding:18px 20px; display:flex; flex-direction:column; gap:6px}
.kpi .k-label{font-size:12.5px; color:var(--ink-2); font-weight:600; display:flex; align-items:center; gap:7px}
.kpi .k-value{font-family:var(--f-display); font-size:30px; line-height:1.05; font-variant-numeric:tabular-nums}
.kpi .k-foot{font-size:12.5px; color:var(--ink-3)}
.kpi.money{background:var(--gold-soft); border-color:transparent; box-shadow:none}
.kpi.money .k-value, .kpi.money .k-label{color:var(--gold)}
.kpi.money .k-foot{color:var(--gold); opacity:.85}
.meter{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden; margin-top:4px}
.meter i{display:block; height:100%; background:var(--ok); border-radius:99px}

.grid-2{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:18px; align-items:start}
.stack{display:flex; flex-direction:column; gap:18px}

/* Today list */
.tl{list-style:none; margin:0; padding:0}
.tl li{display:grid; grid-template-columns:58px minmax(0,1fr) auto; gap:14px; align-items:center; padding:12px 20px; border-top:1px solid var(--line); cursor:pointer; transition:background .12s}
.tl li:hover{background:var(--surface-2)}
.tl .time{font-weight:700; font-variant-numeric:tabular-nums}
.tl .time small{display:block; font-weight:500; color:var(--ink-3); font-size:11.5px}
.tl li.done .row-person b, .tl li.done .time{color:var(--ink-3)}
.tl li.now{background:var(--accent-soft)}
.tl .proc{display:flex; gap:6px; flex-wrap:wrap; margin-top:4px}
.tl .right{display:flex; align-items:center; gap:8px}

/* Return mini list */
.rlist{list-style:none; margin:0; padding:0}
.rlist li{display:flex; align-items:center; gap:12px; padding:12px 20px; border-top:1px solid var(--line)}
.rlist .val{margin-left:auto; text-align:right; flex:none}
.rlist .val b{display:block; font-variant-numeric:tabular-nums; color:var(--gold)}

/* Booking link */
.link-box{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px dashed var(--line-2); border-radius:12px; background:var(--surface-2)}
.link-box code{font-family:inherit; font-weight:600; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1}

/* Agenda */
.toolbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.days{display:flex; gap:6px; flex-wrap:wrap}
.day{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:7px 12px; display:flex; flex-direction:column; align-items:center; min-width:58px; line-height:1.2; color:var(--ink-2)}
.day b{font-size:17px; color:var(--ink); font-variant-numeric:tabular-nums}
.day small{font-size:11px; text-transform:uppercase; letter-spacing:.06em}
.day[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.day[aria-pressed="true"] b{color:var(--accent-ink)}
.legend{display:flex; gap:8px; flex-wrap:wrap}
.agenda-scroll{overflow-x:auto}
.agenda{min-width:720px}
.ag-head{display:grid; grid-template-columns:60px repeat(3, minmax(0,1fr)); border-bottom:1px solid var(--line)}
.ag-head > div{padding:14px 14px 12px; display:flex; align-items:center; gap:10px; min-width:0}
.ag-head .t b{display:block; font-size:13.5px}
.ag-head .t span{font-size:12px; color:var(--ink-3)}
.ag-body{display:grid; grid-template-columns:60px repeat(3, minmax(0,1fr)); position:relative}
.ag-times{position:relative}
.ag-times span{position:absolute; right:10px; transform:translateY(-50%); font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.ag-col{position:relative; border-left:1px solid var(--line); background:repeating-linear-gradient(to bottom, transparent 0 43px, var(--surface-2) 43px 44px, transparent 44px 87px, var(--line) 87px 88px); cursor:copy}
.appt{position:absolute; left:6px; right:6px; border-radius:11px; padding:7px 10px; overflow:hidden; cursor:pointer; border:0; text-align:left; display:flex; flex-direction:column; gap:1px; transition:transform .12s, box-shadow .12s}
.appt:hover{transform:translateY(-1px); box-shadow:var(--shadow)}
.appt .a-time{font-size:11.5px; font-weight:700; opacity:.85; font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:6px}
.appt .a-name{font-weight:700; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.appt .a-proc{font-size:12px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.appt.is-done{opacity:.55}
.appt.is-miss{opacity:.6; text-decoration:line-through}
.dot{width:7px; height:7px; border-radius:50%; display:inline-block; flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.info{background:var(--info)} .dot.accent{background:var(--accent)} .dot.neutral{background:var(--ink-3)}
.now-line{position:absolute; left:60px; right:0; height:0; border-top:2px solid var(--bad); z-index:3; pointer-events:none}
.now-line::before{content:""; position:absolute; left:-6px; top:-6px; width:10px; height:10px; border-radius:50%; background:var(--bad)}
.now-line span{position:absolute; left:-56px; top:-10px; font-size:11px; font-weight:700; color:var(--bad); background:var(--surface); padding:0 4px; border-radius:4px}

/* Returns */
.summary{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; overflow:hidden; margin-bottom:18px}
.summary > div{padding:18px 20px; border-left:1px solid var(--line)}
.summary > div:first-child{border-left:0}
.summary .k-label{font-size:12.5px; color:var(--ink-2); font-weight:600}
.summary .k-value{font-family:var(--f-display); font-size:28px; line-height:1.1; margin-top:4px; font-variant-numeric:tabular-nums}
.summary.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.summary .gold{color:var(--gold)}
.summary .bad{color:var(--bad)}
.tabs{display:flex; gap:4px; flex-wrap:wrap; padding:4px; background:var(--surface-2); border-radius:12px; width:fit-content; max-width:100%}
.tabs button{border:0; background:transparent; padding:7px 13px; border-radius:9px; font-weight:600; font-size:13px; color:var(--ink-2); display:flex; align-items:center; gap:7px}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow)}
.tabs .n{font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.ret-table{width:100%}
.ret{display:grid; grid-template-columns:minmax(200px,1.3fr) minmax(180px,1.3fr) 150px 110px minmax(200px,1.4fr); gap:16px; align-items:center; padding:14px 20px; border-top:1px solid var(--line)}
.ret:first-child{border-top:0}
.ret .proc b{display:block; font-weight:600}
.ret .proc span{font-size:12.5px; color:var(--ink-3)}
.ret .money{font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums}
.ret .msg{display:flex; align-items:center; gap:10px; justify-content:flex-end}
.ret .msg-state{font-size:12.5px; color:var(--ink-3); text-align:right; min-width:0}
.ret .msg-state q{display:block; color:var(--ink); font-style:italic; quotes:"“" "”"}
.ret-head{display:grid; grid-template-columns:minmax(200px,1.3fr) minmax(180px,1.3fr) 150px 110px minmax(200px,1.4fr); gap:16px; padding:12px 20px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600; border-bottom:1px solid var(--line)}
.ret-head .r{text-align:right}
.explain{display:flex; gap:14px; align-items:flex-start; padding:16px 18px; border-radius:var(--r); background:var(--accent-soft); color:var(--ink); margin-bottom:18px}
.explain svg{color:var(--accent); margin-top:2px}
.explain p{margin:0; max-width:80ch}

/* Patients */
.search{display:flex; align-items:center; gap:8px; height:40px; padding:0 12px; border:1px solid var(--line-2); border-radius:12px; background:var(--surface); color:var(--ink-3); min-width:0; flex:1; max-width:360px}
.search input{border:0; outline:0; background:transparent; flex:1; min-width:0; color:var(--ink)}
.table{width:100%; border-collapse:collapse}
.table th{font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:600; text-align:left; padding:12px 20px; border-bottom:1px solid var(--line); white-space:nowrap}
.table td{padding:12px 20px; border-top:1px solid var(--line); vertical-align:middle}
.table tbody tr:first-child td{border-top:0}
.table tbody tr.click{cursor:pointer}
.table tbody tr.click:hover td{background:var(--surface-2)}
.table .r{text-align:right}
.table-scroll{overflow-x:auto}

.p-head{display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:22px}
.p-head .t{flex:1; min-width:220px}
.p-head h1{font-size:30px; margin:0 0 4px}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.p-stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border-top:1px solid var(--line)}
.p-stats > div{padding:14px 22px; border-left:1px solid var(--line)}
.p-stats > div:first-child{border-left:0}
.p-stats span{font-size:12px; color:var(--ink-3); font-weight:600}
.p-stats b{display:block; font-size:16px; margin-top:2px; font-variant-numeric:tabular-nums}
.back{display:inline-flex; align-items:center; gap:6px; border:0; background:transparent; color:var(--ink-2); font-weight:600; padding:4px 0; margin-bottom:12px}
.back:hover{color:var(--ink)}

.timeline{list-style:none; margin:0; padding:6px 20px 20px; position:relative}
.timeline li{display:grid; grid-template-columns:90px 18px minmax(0,1fr); gap:12px; padding:10px 0}
.timeline .when{font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; padding-top:2px}
.timeline .node{position:relative; display:flex; justify-content:center}

(function seedWeek(){
  const rnd = mulberry(7);
  const ids = PATIENTS.map(p => p.id);
  [-3,-2,-1,1,2].forEach(off => {
    const day = addDays(TODAY, off), list = [];
    PROFS.forEach(pr => {
      let t = 8*60 + (rnd() < .5 ? 0 : 30);
      while (t < 18*60){
        if (rnd() < .62){
          const opts = Object.keys(PROCS).filter(k => pr.cats.includes(PROCS[k].cat));
          const proc = opts[Math.floor(rnd()*opts.length)];
          const past = off < 0;
          const status = past ? (rnd() < .09 ? 'faltou' : 'concluido') : (rnd() < .72 ? 'confirmado' : 'pendente');
          list.push(mk(ids[Math.floor(rnd()*ids.length)], proc, pr.id, toHM(t), status));
          t += Math.ceil(PROCS[proc].dur/30)*30;
        } else t += 30;
      }
    });
    APPTS[key(day)] = list;
  });
})();

/* ---------- Regras de retorno ---------- */
function retBucket(r){
  if (r.msg === 'agendado') return 'agendado';
  const d = diffDays(r.due, TODAY);
  if (d < 0) return 'atrasado';
  if (d <= 7) return 'semana';
  if (d <= 30) return 'proximos';
  return 'futuro';
}
function retDue(r){
  const d = diffDays(r.due, TODAY), b = retBucket(r);
  if (b === 'agendado') return `<span class="pill ok">Agendou ${esc(r.booked)}</span>`;
  if (d < 0) return `<span class="pill bad">${-d} ${-d===1?'dia':'dias'} de atraso</span>`;
  if (d === 0) return `<span class="pill warn">Vence hoje</span>`;
  if (d <= 7) return `<span class="pill warn">Vence em ${d} ${d===1?'dia':'dias'}</span>`;
  return `<span class="pill neutral">Em ${d} dias · ${fmtDM(r.due)}</span>`;
}

function patientSummary(p){
  const hist = HISTORY(p.id);
  const total = hist.reduce((s,h)=>s+h.value,0);
  const nextR = RETURNS.find(r => r.pid === p.id);
  return { hist, total, last:hist[0], nextR };
}
function HISTORY(pid){
  if (pid === 'ana') return [
    { d:D(2026,10,15), proc:'toxina', prof:'p1', value:1200, note:'54 U em frontal, glabela e pés de galinha · Botox® lote C3814' },
    { d:D(2026,7,2),  proc:'skin',   prof:'p1', value:950,  note:'Skinbooster face · 2 ml' },
    { d:D(2026,6,10), proc:'toxina', prof:'p1', value:1200, note:'50 U · retoque de 15 dias sem necessidade' },
    { d:D(2026,3,20), proc:'preench',prof:'p1', value:1500, note:'Ácido hialurônico 1 ml · lábios' },
    { d:D(2026,2,12), proc:'toxina', prof:'p1', value:1200, note:'48 U · primeira aplicação' },
    { d:D(2025,11,10),proc:'aval',   prof:'p1', value:0,    note:'Avaliação facial · plano de tratamento em 3 etapas' }
  ];
  const rnd = mulberry([...pid].reduce((a,c)=>a+c.charCodeAt(0),0));
  const keys = Object.keys(PROCS).filter(k => k !== 'aval');
  const out = []; let d = TODAY;
  for (let i=0; i<3+Math.floor(rnd()*3); i++){
    d = addDays(d, -(25 + Math.floor(rnd()*80)));
    const k = keys[Math.floor(rnd()*keys.length)], pr = PROCS[k];
    out.push({ d, proc:k, prof: PROFS.find(x => x.cats.includes(pr.cat)).id, value:pr.price, note:'' });
  }
  const r = RETURNS.find(x => x.pid === pid);
  if (r) out.unshift({ d:r.last, proc:r.proc, prof:PROFS.find(x => x.cats.includes(PROCS[r.proc].cat)).id, value:PROCS[r.proc].price, note:'' });
  return out.sort((a,b)=>b.d-a.d);
}

        <section class="card"><div class="card-head"><h2>Comissões do mês</h2></div>

    <section class="card table-scroll" style="margin-top:18px">

      <table class="table"><thead><tr><th>Procedimento</th><th class="r">Qtde</th><th class="r">Faturamento</th><th class="r">Custo de produto</th><th>Margem</th></tr></thead>

    </section>
  </div>`;
}

            <div class="svc"><span>Toxina botulínica</span><b>${brl(1200)}</b></div>

/* ---------- Render ---------- */
const VIEWS = { inicio:viewInicio, agenda:viewAgenda, retornos:viewRetornos, pacientes:viewPacientes, paciente:viewPaciente, pacotes:viewPacotes, financeiro:viewFinanceiro, procedimentos:viewProcedimentos };
function render(keepScroll){
  const main = document.getElementById('main');
  const y = main.scrollTop;
  renderSide();
  main.innerHTML = VIEWS[state.view]();
  main.scrollTop = keepScroll ? y : 0;
  bindView();
}
function bindView(){
  const q = document.getElementById('q');
  if (q) q.addEventListener('input', e => { state.q = e.target.value; const pos = e.target.selectionStart; render(true); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); });
  const range = document.getElementById('cmp-range');
  if (range) range.addEventListener('input', e => { const v = e.target.value; document.getElementById('cmp-after').style.clipPath = `inset(0 0 0 ${v}%)`; document.getElementById('cmp-h').style.left = v+'%'; });
  const tpl = document.getElementById('tpl');
  if (tpl) tpl.addEventListener('input', e => { TEMPLATE = e.target.value; document.getElementById('tpl-prev').innerHTML = esc(renderMsg(RETURNS[0])) + '<small>10:41 ✓✓</small>'; });
  document.querySelectorAll('[data-ret]').forEach(inp => inp.addEventListener('change', e => {
    const k = e.target.dataset.ret, v = Math.max(1, parseInt(e.target.value,10) || PROCS[k].ret);
    PROCS[k].ret = v; e.target.value = v; toast(`${PROCS[k].name}: retorno em ${v} dias.`);
  }));
}

/* ---------- Toast ---------- */
function toast(t){
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = ic('check') + `<span>${esc(t)}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

/* ---------- Overlays ---------- */
const root = document.getElementById('overlay-root');
let lastFocus = null;
function openOverlay(html, kind='modal'){
  lastFocus = document.activeElement;
  root.innerHTML = kind === 'drawer'
    ? `<div class="overlay drawer" data-act="close-bg"><aside class="panel" role="dialog" aria-modal="true">${html}</aside></div>`
    : `<div class="overlay" data-act="close-bg"><div class="modal ${kind==='wide'?'wide':''}" role="dialog" aria-modal="true">${html}</div></div>`;
  const f = root.querySelector('input, select, textarea, button.primary'); if (f) f.focus();
}
function closeOverlay(){ root.innerHTML = ''; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && root.innerHTML) closeOverlay(); });

function findAppt(id){ for (const k in APPTS){ const a = APPTS[k].find(x => x.id === id); if (a) return [a,k]; } return [null,null]; }
function apptDrawer(id){
  const [a, k] = findAppt(id); if (!a) return;
  const p = P[a.pid], pr = PROCS[a.proc], prof = PROFS.find(x=>x.id===a.prof), st = STATUS[a.status];
  const next = { pendente:[['confirmado','Marcar como confirmado']], confirmado:[['chegou','Paciente chegou']], chegou:[['atendimento','Iniciar atendimento']], atendimento:[['concluido','Concluir atendimento']] }[a.status] || [];
  const r = RETURNS.find(x => x.pid === a.pid);
  openOverlay(`
    <div class="m-head"><div><div class="eyebrow">${fmtLong(fromKey(k))}</div><h2 style="margin-top:4px">${a.time} – ${toHM(toMin(a.time)+a.dur)}</h2></div><button class="icon-btn" data-act="close" aria-label="Fechar">${ic('x')}</button></div>
    <div class="m-body" style="display:flex; flex-direction:column; gap:18px">
      <div class="row-person" style="cursor:pointer" data-act="patient" data-id="${p.id}">${avatar(p)}<div class="t"><b>${esc(p.name)}</b><span>${esc(p.phone)} · ${p.age} anos</span></div></div>
      <div><span class="pill ${st.cls}">${st.label}</span></div>
      <dl class="dl">
        <dt>Procedimento</dt><dd><span class="tag cat-${pr.cat}">${esc(pr.name)}${a.session?` · sessão ${a.session}`:''}</span></dd>
        <dt>Profissional</dt><dd>${esc(prof.name)}</dd>
        <dt>Valor</dt><dd class="num">${pr.price?brl(pr.price):'Gratuita'}</dd>
        ${pr.ret ? `<dt>Retorno</dt><dd>${pr.ret} dias depois (${fmtDM(addDays(fromKey(k), pr.ret))})</dd>`:''}
        ${a.note ? `<dt>Observação</dt><dd>${esc(a.note)}</dd>`:''}
      </dl>
      ${p.tags && /Alergia|sensível/.test(p.tags[0]) ? `<div class="notice" style="background:var(--bad-soft); color:var(--bad)">${ic('bell')}${esc(p.tags[0])}</div>`:''}
      ${a.status==='pendente' ? `<div class="notice">${ic('clock')}Lembrete enviado ontem às 10:00. Sem resposta ainda.</div>`:''}
      ${a.status==='concluido' && pr.ret ? `<div class="notice" style="background:var(--ok-soft); color:var(--ok)">${ic('ret')}Retorno programado para ${fmtDMY(addDays(fromKey(k), pr.ret))}. Ela vai aparecer na lista na hora certa.</div>`:''}
    </div>
    <div class="m-foot">
      ${a.status!=='concluido' && a.status!=='faltou' ? `<button class="btn ghost" data-act="st" data-id="${a.id}" data-s="faltou">Faltou</button>`:''}
      ${a.status==='pendente' ? `<button class="btn" data-act="remind" data-id="${a.id}">${ic('msg')}Lembrar de novo</button>`:''}
      ${next.map(([s,l]) => `<button class="btn primary" data-act="st" data-id="${a.id}" data-s="${s}">${l}</button>`).join('')}
    </div>`, 'drawer');
}

function msgModal(id){
  const r = RETURNS.find(x => x.id === id), p = P[r.pid], pr = PROCS[r.proc];
  const text = renderMsg(r);
  openOverlay(`
    <div class="m-head"><div><div class="eyebrow">Chamar de volta</div><h2 style="margin-top:4px">Mensagem para ${esc(firstName(p.name))}</h2>
      <p class="small muted" style="margin:4px 0 0">${esc(pr.name)} · última em ${fmtDMY(r.last)} · valor ${brl(pr.price)}</p></div><button class="icon-btn" data-act="close" aria-label="Fechar">${ic('x')}</button></div>
    <div class="m-body"><div class="msg-grid">
      <div class="field"><label for="msg-text">Texto (pode editar antes de enviar)</label><textarea class="inp" id="msg-text" rows="9">${esc(text)}</textarea>
        <label class="switch" for="msg-slots" style="margin-top:6px"><input type="checkbox" id="msg-slots" checked><span>Incluir 3 horários livres desta semana</span></label></div>
      <div class="wa"><div class="wa-top">${avatar(p,'sm')}${esc(p.name)}</div><div class="wa-day">Hoje</div><div class="wa-bubble" id="msg-prev">${esc(text)}\n\n📅 Qui 22/10 às 10:30\n📅 Sex 23/10 às 14:00\n📅 Sáb 24/10 às 09:00<small>10:41</small></div></div>
    </div></div>
    <div class="m-foot"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" data-act="send" data-id="${r.id}">${ic('send')}Enviar pelo WhatsApp</button></div>`, 'wide');
  const ta = document.getElementById('msg-text'), cb = document.getElementById('msg-slots'), pv = document.getElementById('msg-prev');
  const upd = () => { pv.innerHTML = esc(ta.value + (cb.checked ? '\n\n📅 Qui 22/10 às 10:30\n📅 Sex 23/10 às 14:00\n📅 Sáb 24/10 às 09:00' : '')) + '<small>10:41</small>'; };
  ta.addEventListener('input', upd); cb.addEventListener('change', upd);
}

function newModal(pre={}){
  const times = []; for (let m = DAY_START; m < DAY_END; m += 30) times.push(toHM(m));
  const date = pre.date || state.day;
  openOverlay(`
    <div class="m-head"><div><div class="eyebrow">Agenda</div><h2 style="margin-top:4px">Novo agendamento</h2></div><button class="icon-btn" data-act="close" aria-label="Fechar">${ic('x')}</button></div>
    <form class="m-body" id="new-form"><div class="fields">
      <div class="field full"><label for="f-p">Paciente</label><select class="inp" id="f-p">${PATIENTS.map(p=>`<option value="${p.id}" ${pre.pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-proc">Procedimento</label><select class="inp" id="f-proc">${Object.entries(PROCS).map(([k,v])=>`<option value="${k}" ${pre.proc===k?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-prof">Profissional</label><select class="inp" id="f-prof">${PROFS.map(pr=>`<option value="${pr.id}" ${pre.prof===pr.id?'selected':''}>${esc(pr.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="f-d">Data</label><input class="inp" id="f-d" type="date" value="${date}"></div>
      <div class="field"><label for="f-t">Horário</label><select class="inp" id="f-t">${times.map(t=>`<option ${pre.time===t?'selected':''}>${t}</option>`).join('')}</select></div>
      <div class="field full"><label class="switch" for="f-sinal"><input type="checkbox" id="f-sinal"><span>Cobrar sinal de 30% via Pix para garantir o horário</span></label></div>
      <div class="field full"><label class="switch" for="f-conf"><input type="checkbox" id="f-conf" checked><span>Pedir confirmação pelo WhatsApp 24 h antes</span></label></div>
    </div></form>
    <div class="m-foot"><button class="btn ghost" data-act="close">Cancelar</button><button class="btn primary" data-act="save" data-ret="${pre.retId||''}">${ic('check')}Agendar</button></div>`);
  const fp = document.getElementById('f-proc'), fprof = document.getElementById('f-prof');
  const sync = () => { const c = PROCS[fp.value].cat; const pr = PROFS.find(x => x.cats.includes(c)); if (pr) fprof.value = pr.id; };
  fp.addEventListener('change', sync); if (!pre.prof) sync();
  document.getElementById('new-form').addEventListener('submit', e => e.preventDefault());
}

/* ---------- Ações ---------- */
const ACT = {
  nav: t => { state.view = t.dataset.v; closeOverlay(); render(); },
  day: t => { state.day = t.dataset.k; render(true); },
  rf: t => { state.retFilter = t.dataset.f; render(true); },
  ptab: t => { state.ptab = t.dataset.t; render(true); },
  patient: t => { state.pid = t.dataset.id; state.ptab = 'historico'; state.view = 'paciente'; closeOverlay(); render(); },
  appt: t => apptDrawer(t.dataset.id),
  slot: (t, e) => {
    if (e.target.closest('.appt')) return;
    const rect = t.getBoundingClientRect();
    const m = DAY_START + Math.floor((e.clientY - rect.top) / PX / 30) * 30;
    newModal({ prof:t.dataset.prof, time:toHM(Math.min(Math.max(m, DAY_START), DAY_END-30)) });
  },
  new: t => newModal({ pid:t.dataset.pid }),
  msg: t => msgModal(t.dataset.id),
  book: t => { const r = RETURNS.find(x => x.id === t.dataset.id); newModal({ pid:r.pid, proc:r.proc, date:key(addDays(TODAY,2)), time:'10:30', retId:r.id }); },
  close: () => closeOverlay(),
  'close-bg': (t, e) => { if (e.target === t) closeOverlay(); },
  send: t => {
    const r = RETURNS.find(x => x.id === t.dataset.id);
    r.msg = 'enviado'; r.sent = 'Agora · entregue';
    closeOverlay(); render(true); toast(`Mensagem enviada para ${firstName(P[r.pid].name)}.`);
  },
  bulk: () => {
    const list = openReturns().filter(r => r.msg === 'novo');
    list.forEach(r => { r.msg = 'enviado'; r.sent = 'Agora · entregue'; });
    render(true); toast(`${list.length} mensagens enviadas. As respostas aparecem aqui.`);
  },
  save: t => {
    const pid = document.getElementById('f-p').value, proc = document.getElementById('f-proc').value, prof = document.getElementById('f-prof').value;
    const d = document.getElementById('f-d').value || key(TODAY), time = document.getElementById('f-t').value;
    (APPTS[d] = APPTS[d] || []).push(mk(pid, proc, prof, time, document.getElementById('f-conf').checked ? 'pendente' : 'confirmado'));
    const retId = t.dataset.ret;
    if (retId){ const r = RETURNS.find(x => x.id === retId); r.msg = 'agendado'; r.booked = `${fmtDM(fromKey(d))} às ${time}`; }
    closeOverlay(); render(true);
    toast(`${firstName(P[pid].name)} agendada para ${fmtDM(fromKey(d))} às ${time}.`);
  },
  st: t => {
    const [a, k] = findAppt(t.dataset.id); a.status = t.dataset.s;
    const pr = PROCS[a.proc];
    if (a.status === 'concluido' && pr.ret){
      const due = addDays(fromKey(k), pr.ret);
      RETURNS.push({ id:'r'+Date.now(), pid:a.pid, proc:a.proc, last:fromKey(k), due, msg:'novo' });
      toast(`Concluído. Retorno de ${pr.name.toLowerCase()} programado para ${fmtDMY(due)}.`);
    } else toast(`${firstName(P[a.pid].name)}: ${STATUS[a.status].label.toLowerCase()}.`);
    render(true); apptDrawer(a.id);
  },
  remind: t => { toast('Lembrete reenviado pelo WhatsApp.'); },
  copy: () => {
    const txt = 'https://' + CLINIC.link;
    const done = () => toast('Link copiado.');
    const fallback = () => { const el = document.getElementById('clinic-link'); const s = window.getSelection(), r = document.createRange(); r.selectNodeContents(el); s.removeAllRanges(); s.addRange(r); toast('Link selecionado. Use Ctrl+C para copiar.'); };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch(e){ fallback(); }
  },
  var: t => { const ta = document.getElementById('tpl'); const s = ta.selectionStart, e = ta.selectionEnd; ta.value = ta.value.slice(0,s) + t.dataset.v + ta.value.slice(e); ta.focus(); ta.setSelectionRange(s+t.dataset.v.length, s+t.dataset.v.length); ta.dispatchEvent(new Event('input')); },
  toast: t => toast(t.dataset.t)
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  if (t.dataset.act !== 'slot' && t.dataset.act !== 'close-bg') e.stopPropagation();
  fn(t, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act], .row-person[data-act], li[data-act]')){ e.preventDefault(); e.target.click(); }
});

render();
</script>
